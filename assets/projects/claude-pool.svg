      <text x="590" y="228" fill="#86A7C4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle">ACCOUNT A</text>
    </g>
    <g>
      <circle cx="590" cy="270" r="38" fill="#0D2943" stroke="#2A8CC6" stroke-width="2"/>
      <circle cx="590" cy="270" r="12" fill="#35B7E8"/>
      <text x="590" y="322" fill="#86A7C4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle">ACCOUNT B</text>
    </g>
