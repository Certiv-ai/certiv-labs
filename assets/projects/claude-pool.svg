  <text x="300" y="84" fill="#8FA0B7" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">LABS</text>

  <text x="56" y="156" fill="#3AF7AD" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">PROJECT 001 · EXPERIMENTAL</text>
  <text x="56" y="226" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1">Claude Pool</text>
  <text x="56" y="274" fill="#D4DDE9" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600">Keep local Claude Code sessions moving.</text>
  <text x="56" y="322" fill="#93A3B8" font-family="Inter, Arial, sans-serif" font-size="20">Routes new terminal and local Desktop sessions across multiple</text>
  <text x="56" y="351" fill="#93A3B8" font-family="Inter, Arial, sans-serif" font-size="20">subscriptions you own. Local credentials. No Certiv telemetry.</text>

