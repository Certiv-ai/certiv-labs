<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Claude Pool</title>
  <desc id="description">A Certiv Labs project card showing multiple local accounts routed through a pool to a terminal session.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071121"/>
      <stop offset="0.62" stop-color="#0A172B"/>
      <stop offset="1" stop-color="#071121"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(790 90) rotate(137) scale(520 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#009CFE" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#16BFDE" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#071121" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0058FF"/>
      <stop offset="0.48" stop-color="#06A5F5"/>
      <stop offset="1" stop-color="#3AF7AD"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#background)"/>
  <rect width="960" height="540" rx="28" fill="url(#glow)"/>
  <rect x="510" width="450" height="540" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="538" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g transform="translate(54 48)">
    <rect width="46" height="46" rx="13" fill="url(#brand)"/>
    <path d="M23 9C23.6 17.3 28.7 22.4 37 23C28.7 23.6 23.6 28.7 23 37C22.4 28.7 17.3 23.6 9 23C17.3 22.4 22.4 17.3 23 9Z" fill="#071121"/>
    <text x="62" y="31" fill="#DDE7F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">CERTIV LABS</text>
  </g>

  <text x="54" y="176" fill="#3AF7AD" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">EXPERIMENTAL TOOL</text>
  <text x="54" y="250" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="750" letter-spacing="-2">Claude Pool</text>
  <text x="54" y="298" fill="#A9B7CA" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="500">Local session routing for Claude Code</text>

  <g transform="translate(54 386)">
    <rect width="104" height="40" rx="20" fill="#0D2740" stroke="#1E537D"/>
    <text x="52" y="26" fill="#CBE8FF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">macOS</text>
    <rect x="116" width="124" height="40" rx="20" fill="#0D2F2B" stroke="#1D6657"/>
    <text x="178" y="26" fill="#C8F9E8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Local-first</text>
  </g>

