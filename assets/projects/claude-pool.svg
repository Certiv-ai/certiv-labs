      <circle cx="590" cy="364" r="12" fill="#35B7E8"/>
      <text x="590" y="416" fill="#86A7C4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle">ACCOUNT C</text>
    </g>

    <circle cx="754" cy="270" r="58" fill="#0C322D" stroke="#36D8A4" stroke-width="3"/>
    <path d="M754 235C755 255 766 268 788 270C766 272 755 285 754 305C753 285 742 272 720 270C742 268 753 255 754 235Z" fill="#3AF7AD"/>
    <text x="754" y="346" fill="#A4DCC9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">POOL</text>

    <path d="M812 270H842" stroke="#3AF7AD" stroke-width="3" stroke-linecap="round"/>
    <path d="M834 261L844 270L834 279" fill="none" stroke="#3AF7AD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="842" y="221" width="76" height="98" rx="13" fill="#0D1D32" stroke="#59718D" stroke-width="2"/>
    <rect x="856" y="239" width="48" height="62" rx="5" fill="#07111F"/>
    <path d="M866 256L875 264L866 272" fill="none" stroke="#3AF7AD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M882 274H894" stroke="#3AF7AD" stroke-width="3" stroke-linecap="round"/>
    <text x="880" y="346" fill="#A4B3C8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">SESSION</text>
  </g>

  <line x1="54" y1="474" x2="906" y2="474" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="54" y="510" fill="#D7E0ED" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">AI Agent Assurance for Endpoints</text>
  <text x="906" y="510" fill="#7F91AA" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="end">github.com/Certiv-ai/certiv-labs</text>
