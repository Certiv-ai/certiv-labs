<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title description">
  <title id="title">Claude Pool</title>
  <desc id="description">A Certiv Labs project card for Claude Pool, a local macOS launcher that routes Claude Code terminal and Desktop sessions across multiple subscriptions owned by one person.</desc>
