name: Bug report
description: Report reproducible incorrect behavior in a Certiv Labs tool.
title: "[bug] "
labels:
  - bug
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - selectstar
        - integrationtestnames
        - claude-pool
        - Repository documentation or automation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe code sample and exact command.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Commit, tag, or development branch
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime version
      description: Include the relevant Go or Python version.
      placeholder: Output of go version or python3 --version
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not contain a vulnerability or sensitive information.
          required: true
