name: Release Claude Pool

on:
  push:
    tags:
      - "claude-pool/v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tools/claude-pool
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Verify tag matches package version
        run: |
          version="$(python3 -c 'from claude_pool import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "claude-pool/v${version}"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Build release archives
        run: python3 scripts/build_release.py

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-pool-release
          path: tools/claude-pool/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: claude-pool-release
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#claude-pool/v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Claude Pool ${version}"
