[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certiv-claude-pool"
version = "0.5.0"
description = "A Certiv Labs local session router for Claude Code on macOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [
  { name = "Certiv" },
]
license = { text = "Apache-2.0" }
classifiers = [
  "Environment :: MacOS X",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/Certiv-ai/certiv-labs/tree/main/tools/claude-pool"
Repository = "https://github.com/Certiv-ai/certiv-labs/tree/main/tools/claude-pool"
Issues = "https://github.com/Certiv-ai/certiv-labs/issues"

[project.scripts]
claude-pool = "claude_pool.cli:main"

[tool.setuptools.packages.find]
include = ["claude_pool*"]
